[package]
name = "atlas-win-space"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/neondeex/atlas-filemanager"
homepage = "https://atlasnative.com"

[target.'cfg(windows)'.dependencies]
atlas-model = { path = "../atlas-model", default-features = false }
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole",
    "Win32_System_Variant", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Media_MediaFoundation",
    "Data_Pdf", "Storage", "Storage_Streams",
    "Media_Ocr", "Graphics_Imaging", "Globalization",
] }
windows-sys = { version = "0.52", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Graphics_Gdi",
    "Win32_System_Ioctl",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }
windows-sys-copy = { package = "windows-sys", version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
